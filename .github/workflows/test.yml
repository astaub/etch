name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run contract test
        run: node test/contract.test.mjs
